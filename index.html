<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cloud Notepad (Mobile Twin)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: #18181b;
            color: #d4d4d8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Bar */
        .header {
            background: #202024;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            border-bottom: 1px solid #2e2e38;
        }
        .title {
            font-size: 13px;
            font-weight: 700;
            color: #e4e4e7;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .badges {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .badge {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 4px;
        }
        .badge-live {
            background: #14532d;
            color: #4ade80;
        }
        .btn-refresh {
            background: #27272a;
            color: #fff;
            border: 1px solid #3f3f46;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Editor Area */
        .editor-container {
            flex: 1;
            display: flex;
            position: relative;
        }
        textarea {
            width: 100%;
            height: 100%;
            background-color: #121214;
            color: #f4f4f5;
            font-family: "Cascadia Code", "Consolas", monospace;
            font-size: 15px;
            line-height: 1.5;
            padding: 14px;
            border: none;
            outline: none;
            resize: none;
            tab-size: 4;
        }

        /* Bottom Floating Bar */
        .bottom-bar {
            background: #202024;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            font-size: 11px;
            color: #a1a1aa;
            border-top: 1px solid #2e2e38;
        }
        .status-text {
            color: #4ade80;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">
            <span>📝 Cloud Notepad (Mobile Twin)</span>
        </div>
        <div class="badges">
            <button class="btn-refresh" onclick="fetchLatestState(true)">🔄 Sync Now</button>
            <span id="syncBadge" class="badge badge-live">● CONNECTED</span>
        </div>
    </div>

    <div class="editor-container">
        <textarea id="editor" spellcheck="false" placeholder="Loading twin notepad..."></textarea>
    </div>

    <div class="bottom-bar">
        <span id="charCount">0 characters</span>
        <span id="statusIndicator" class="status-text">Connected (Dedicated Backend)</span>
    </div>

    <script>
        const ISSUE_URL = "https://api.github.com/repos/Sandeep-Gugulothu/twin-notepad-live/issues/1";
        const GITHUB_TOKEN = atob("Z2hvX1ROTnRJTmM5bDl3VVdWVHdkS3h2Nzlyd0h2RVh5MzAwYnNRUw==");

        const editor = document.getElementById('editor');
        const statusIndicator = document.getElementById('statusIndicator');
        const syncBadge = document.getElementById('syncBadge');
        const charCount = document.getElementById('charCount');

        let isApplyingRemote = false;
        let broadcastTimer = null;
        let lastPushedText = "";

        editor.addEventListener('input', () => {
            if (isApplyingRemote) return;
            updateStats();

            clearTimeout(broadcastTimer);
            broadcastTimer = setTimeout(() => {
                pushCurrentState();
            }, 500); // 500ms debounce
        });

        function updateStats() {
            charCount.textContent = `${editor.value.length} characters`;
        }

        async function pushCurrentState() {
            const text = editor.value;
            lastPushedText = text;
            syncBadge.textContent = "↑ PUSHING...";

            try {
                const res = await fetch(ISSUE_URL, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json',
                        'User-Agent': 'NotepadMobile'
                    },
                    body: JSON.stringify({ body: text })
                });

                if (res.ok) {
                    syncBadge.textContent = "● SYNCED";
                }
            } catch (err) {
                console.error("Push error:", err);
                syncBadge.textContent = "⚠ RETRYING";
            }
        }

        async function fetchLatestState(isManual = false) {
            try {
                const res = await fetch(ISSUE_URL, {
                    headers: {
                        'Authorization': `Bearer ${GITHUB_TOKEN}`,
                        'User-Agent': 'NotepadMobile'
                    },
                    cache: 'no-store'
                });

                if (res.ok) {
                    const data = await res.json();
                    if (data.body !== undefined && data.body !== editor.value && data.body !== lastPushedText) {
                        isApplyingRemote = true;
                        const selStart = editor.selectionStart;
                        const selEnd = editor.selectionEnd;

                        editor.value = data.body;
                        editor.setSelectionRange(selStart, selEnd);
                        isApplyingRemote = false;
                        updateStats();

                        syncBadge.textContent = "↓ RECEIVED";
                        setTimeout(() => { syncBadge.textContent = "● SYNCED"; }, 300);
                    }
                }
            } catch (err) {
                console.error("Fetch error:", err);
            }

            if (!isManual) {
                setTimeout(fetchLatestState, 1500); // Poll every 1.5s
            }
        }

        // Start initial load & auto-poll
        fetchLatestState();
    </script>
</body>
</html>
